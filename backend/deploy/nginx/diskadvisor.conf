# DiskAdvisor nginx config: serves the built React SPA and reverse-proxies
# /api/ to the diskadvisor-api systemd service (uvicorn on 127.0.0.1:8000).
#
# Plain HTTP, no TLS -- operator choice (internal network, no certificate
# issued for this host). If that changes later, terminate TLS here with a
# `listen 443 ssl` server block and redirect port 80 to it.
#
# Install: cp this file to /etc/nginx/conf.d/diskadvisor.conf, remove/comment
# out the default `server {}` block in /etc/nginx/nginx.conf so it doesn't
# collide on port 80, then `nginx -t && systemctl enable --now nginx`.
#
# RHEL SELinux (enforcing by default) blocks nginx from connecting to the
# uvicorn port unless this boolean is set, otherwise /api/ requests fail
# with 502 Bad Gateway:
#   setsebool -P httpd_can_network_connect 1

server {
    listen 80;
    server_name _;

    root /opt/diskadvisor/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
